apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: coinupapi:local
    newName: coinupapi
    newTag: ci
  - name: coinupworker:local
    newName: coinupworker
    newTag: ci
# CI uses the default (dev) password from base. For real deployments, replace the secret.
