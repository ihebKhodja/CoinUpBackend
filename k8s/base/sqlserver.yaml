apiVersion: v1
kind: Secret
metadata:
  name: coinup-secrets
  namespace: coinup
type: Opaque
stringData:
  # For local dev only. Change this before using outside of a dev machine.
  MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CoinDB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlserver-data
  namespace: coinup
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: coinup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coinup-secrets
                  key: MSSQL_SA_PASSWORD
          ports:
            - containerPort: 1433
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sqlserver-data
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: coinup
spec:
  selector:
    app: sqlserver
  ports:
    - name: tds
      port: 1433
      targetPort: 1433
