apiVersion: apps/v1
kind: Deployment
metadata:
  name: coinupapi
  namespace: coinup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coinupapi
  template:
    metadata:
      labels:
        app: coinupapi
    spec:
      initContainers:
        - name: wait-for-sql
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z sqlserver 1433; do echo waiting for sqlserver; sleep 2; done",
            ]
      containers:
        - name: coinupapi
          image: coinupapi:local
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: RUN_MIGRATIONS
              value: "true"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: coinup-secrets
                  key: ConnectionStrings__DefaultConnection
          readinessProbe:
            httpGet:
              path: /swagger/v1/swagger.json
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /swagger/v1/swagger.json
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: coinupapi
  namespace: coinup
spec:
  selector:
    app: coinupapi
  ports:
    - name: http
      port: 8080
      targetPort: 8080
