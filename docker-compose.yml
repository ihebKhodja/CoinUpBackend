services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "bash", "-lc", "</dev/tcp/localhost/1433"]
      interval: 10s
      timeout: 5s
      retries: 20

  coinupapi:
    build:
      context: .
      dockerfile: CoinUpAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=CoinDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      RUN_MIGRATIONS: "true"
    depends_on:
      - sqlserver
    ports:
      - "5000:8080"

  coinupworker:
    build:
      context: .
      dockerfile: CoinUpWorkerService/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=CoinDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
    depends_on:
      - sqlserver

  coinupfront:
    build:
      context: C:/Users/Etudiant/Desktop/PROJETS/CoinUpFront
      dockerfile: Dockerfile
    depends_on:
      - coinupapi
    ports:
      - "4200:80"

# Frontend (Angular) is maintained in a separate repository.
# To run it with Docker, use the optional compose file: docker-compose.frontend.yml

volumes:
  sqlserverdata:
