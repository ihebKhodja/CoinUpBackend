name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CoinUpBackend.sln

      - name: Build
        run: dotnet build CoinUpBackend.sln -c Release --no-restore

      - name: Test (API)
        run: dotnet test CoinUpAPI/CoinUpAPI.Tests/CoinUpAPI.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Test (Worker)
        run: dotnet test CoinUpWorkerService/CoinUpWorkerService.Tests/CoinUpWorkerService.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            **/TestResults/**/coverage.cobertura.xml
            **/TestResults/**/coverage.opencover.xml
            **/TestResults/**/coverage.json

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CoinUpAPI/Dockerfile
          push: false
          tags: coinupapi:ci

      - name: Build Worker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CoinUpWorkerService/Dockerfile
          push: false
          tags: coinupworker:ci

  k8s-kind-smoke:
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images for kind
        run: |
          docker build -f CoinUpAPI/Dockerfile -t coinupapi:ci .
          docker build -f CoinUpWorkerService/Dockerfile -t coinupworker:ci .

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: coinup

      - name: Load images into kind
        run: |
          kind load docker-image coinupapi:ci --name coinup
          kind load docker-image coinupworker:ci --name coinup

      - name: Deploy manifests (CI overlay)
        run: |
          kubectl apply -k k8s/overlays/ci

      - name: Wait for API readiness
        run: |
          kubectl -n coinup rollout status deploy/coinupapi --timeout=180s

      - name: Smoke test Swagger endpoint
        run: |
          kubectl -n coinup port-forward svc/coinupapi 8080:8080 &
          sleep 3
          curl -fsS http://localhost:8080/swagger/v1/swagger.json > /dev/null
